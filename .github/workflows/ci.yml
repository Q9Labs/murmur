name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run gate:hygiene
      - run: pnpm test
      - run: pnpm run test:coverage
      - run: pnpm run test:presence
      - run: pnpm run deps:syncpack
      - run: pnpm run lint:spelling
      - run: pnpm --filter @murmur/mobile exec expo export --platform web --output-dir /tmp/murmur-web
        env:
          EAS_BUILD_PROFILE: preview
          EXPO_PUBLIC_MURMUR_ENV: preview
          EXPO_PUBLIC_MURMUR_WORKER_URL: https://murmur-worker-dev.msbilal.workers.dev
      - run: pnpm --filter @murmur/worker exec wrangler deploy --dry-run --env=""
      - run: pnpm run store:secrets
      - run: pnpm run store:config
      - run: pnpm run store:metadata
      - run: pnpm run store:blockers

  # The static and security lanes of `pnpm run gate`. The pre-commit hook leaves them out because they are slow.
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install Semgrep
        run: pipx install semgrep==1.176.0
      - run: pnpm run static:fallow
      - run: pnpm run static:fallow:health
      - run: pnpm run static:semgrep

  # Advisory because both checks fail on main today: OSV reports open node-forge, glob, minimatch and decode-uri-component advisories, and Expo Doctor reports seven Expo patch versions behind SDK 57.
  advisory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install OSV-Scanner
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.local/bin"
          curl -fsSL -o "$HOME/.local/bin/osv-scanner" https://github.com/google/osv-scanner/releases/download/v2.6.0/osv-scanner_linux_amd64
          chmod +x "$HOME/.local/bin/osv-scanner"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - run: pnpm run security:osv
        continue-on-error: true
      - run: pnpm run react:doctor
        continue-on-error: true

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Scan every reachable commit for secrets
        uses: docker://ghcr.io/gitleaks/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f # v8.30.1
        with:
          args: git --redact --verbose --log-opts=--all .

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
