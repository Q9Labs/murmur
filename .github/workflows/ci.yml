name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.26.2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run gate:hygiene
      - run: pnpm test
      - run: pnpm run test:coverage
      - run: pnpm run test:presence
      - run: pnpm run deps:syncpack
      - run: pnpm run lint:spelling
      - run: pnpm --filter @murmur/mobile exec expo export --platform web --output-dir /tmp/murmur-web
      - run: pnpm --filter @murmur/worker exec wrangler deploy --dry-run --env=""
      - run: pnpm run store:secrets
      - run: pnpm run store:config
      - run: pnpm run store:metadata
      - run: pnpm run store:blockers

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v5
