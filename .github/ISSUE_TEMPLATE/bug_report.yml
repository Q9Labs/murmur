name: Bug report
description: Report a reproducible Murmur defect
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not include credentials, private speech or transcript content, or security vulnerabilities. Report vulnerabilities privately as described in SECURITY.md.
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the observed and expected behavior.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Provide the smallest reliable sequence of steps.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Murmur version
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options: [Android, iOS, Web, Worker, Development tooling]
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Redacted diagnostics
      description: Remove tokens, user content, identifiers, and private URLs.
