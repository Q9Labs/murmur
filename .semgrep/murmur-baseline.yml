rules:
  - id: murmur.javascript.forbid-dynamic-code
    languages: [generic]
    severity: ERROR
    message: Avoid eval, new Function, and string-based timers.
    paths:
      include:
        - "/apps/mobile/app/**"
        - "/apps/mobile/src/**"
        - "/apps/mobile/modules/**"
        - "/apps/mobile/plugins/**"
        - "/apps/worker/src/**"
        - "/tooling/**"
    pattern-regex: \b(eval\s*\(|new\s+Function\s*\(|set(?:Timeout|Interval)\s*\(\s*['"`])

  - id: murmur.tests.forbid-focused-or-skipped-tests
    languages: [javascript, typescript]
    severity: ERROR
    message: Do not commit focused or skipped tests.
    paths:
      include:
        - "**/*.test.ts"
        - "**/*.test.tsx"
        - "**/*.test.js"
        - "**/*.spec.ts"
        - "**/*.spec.tsx"
        - "**/*.spec.js"
    pattern-either:
      - pattern: test.only(...)
      - pattern: describe.only(...)
      - pattern: it.only(...)
      - pattern: test.skip(...)
      - pattern: describe.skip(...)
      - pattern: it.skip(...)

  - id: murmur.javascript.require-suppression-justification
    languages: [javascript, typescript]
    severity: ERROR
    message: Suppressions need an adjacent justification.
    pattern-regex: (?m)^\s*//\s*(?:@ts-ignore|eslint-disable(?:-next-line|-line)?)(?!.*(?:because|reason|justification|intentional|safe|false positive|false-positive)).*$

  - id: murmur.javascript.no-console-in-app-code
    languages: [javascript, typescript]
    severity: ERROR
    message: Route logs through the repo logger or keep console usage in scripts/tests.
    paths:
      include:
        - "/apps/mobile/app/**"
        - "/apps/mobile/src/**"
        - "/apps/worker/src/**"
      exclude:
        - "**/*.test.*"
        - "/apps/worker/src/privacy.ts"
    pattern-either:
      - pattern: console.log(...)
      - pattern: console.error(...)

  - id: murmur.javascript.process-env-approved-modules
    languages: [javascript, typescript]
    severity: ERROR
    message: Read process.env only from approved config, Worker, or script modules.
    paths:
      include:
        - "/apps/mobile/app/**"
        - "/apps/mobile/src/**"
      exclude:
        - "**/*.test.*"
        - "/apps/mobile/src/lib/config.ts"
    pattern: process.env.$KEY

  - id: murmur.javascript.no-raw-token-storage
    languages: [javascript, typescript]
    severity: ERROR
    message: Do not persist token/session material through raw web storage.
    paths:
      include:
        - "/apps/mobile/app/**"
        - "/apps/mobile/src/**"
      exclude:
        - "/apps/mobile/src/lib/installIdentity.ts"
    patterns:
      - pattern-either:
          - pattern: localStorage.setItem($KEY, $VALUE)
          - pattern: sessionStorage.setItem($KEY, $VALUE)
          - pattern: $STORAGE.setItem($KEY, $VALUE)
      - metavariable-regex:
          metavariable: $KEY
          regex: (?i).*(token|session|secret|key|auth|credential).*

  - id: murmur.javascript.fetch-only-through-approved-clients
    languages: [javascript, typescript]
    severity: ERROR
    message: Keep app fetch calls in approved backend/provider/config modules.
    paths:
      include:
        - "/apps/mobile/app/**"
        - "/apps/mobile/src/**"
      exclude:
        - "**/*.test.*"
        - "/apps/mobile/src/lib/useLiveTranslation.ts"
        - "/apps/mobile/src/lib/live-translation/workerApi.ts"
        - "/apps/mobile/src/lib/providers/**"
    pattern: fetch(...)

  - id: murmur.placeholders.no-checked-in-placeholder-copy
    languages: [generic]
    severity: ERROR
    message: Remove placeholder gate/test/lint copy before committing.
    paths:
      exclude:
        - "/.semgrep/**"
        - "/tooling/gates/hygiene.mjs"
    pattern-regex: (?i)(TODO:\s*document|No tests configured yet|No linter configured yet|generated contract stub)

  - id: murmur.node.no-shell-true-interpolation
    languages: [generic]
    severity: ERROR
    message: Avoid interpolating untrusted strings into shell:true child process calls.
    paths:
      include:
        - "/tooling/**"
        - "/apps/mobile/plugins/**"
        - "/apps/worker/src/**"
    pattern-regex: (?s)\b(?:exec|execSync|spawn|spawnSync)\s*\([^)]*\$\{[^)]*shell\s*:\s*true

  - id: murmur.worker.use-canonical-worker-url-config
    languages: [javascript, typescript]
    severity: ERROR
    message: App code must use getWorkerBaseUrl for Worker URL access.
    paths:
      include:
        - "/apps/mobile/app/**"
        - "/apps/mobile/src/**"
      exclude:
        - "**/*.test.*"
        - "/apps/mobile/src/lib/config.ts"
    pattern: process.env.EXPO_PUBLIC_MURMUR_WORKER_URL

  - id: murmur.privacy.microphone-copy-approved-files
    languages: [generic]
    severity: ERROR
    message: Microphone/audio permission copy belongs in approved config and store metadata files.
    paths:
      include:
        - "/apps/mobile/app/**"
        - "/apps/mobile/src/**"
        - "/apps/worker/src/**"
      exclude:
        - "/apps/mobile/app/index.tsx"
        - "/apps/mobile/app.json"
        - "/docs/legal/**"
        - "/apps/mobile/fastlane/metadata/**"
        - "/apps/mobile/src/lib/useLiveTranslation.ts"
        - "/apps/mobile/src/lib/live-translation/useLiveTranslation.ts"
        - "/apps/worker/src/legalPages.ts"
    pattern-regex: (?i)\b(audio permission|record audio|speech audio|microphone permission)\b

  - id: murmur.secrets.raw-openai-key-references
    languages: [generic]
    severity: ERROR
    message: Raw OpenAI key references are allowed only in validators, Worker provider/env modules, docs, and examples.
    paths:
      include:
        - "/apps/mobile/app/**"
        - "/apps/mobile/src/**"
        - "/apps/worker/src/**"
      exclude:
        - "**/*.test.*"
        - "/tooling/scripts/validate-no-secrets.mjs"
        - "/apps/worker/src/env.ts"
        - "/apps/worker/src/index.ts"
        - "/apps/worker/src/providers/openaiRealtime.ts"
        - "/docs/**"
    pattern-regex: (?i)\b(?:OPENAI_API_KEY|sk-(?:proj-|svcacct-)?[A-Za-z0-9_-]{20,})\b
