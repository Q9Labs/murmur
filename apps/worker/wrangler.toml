name = "murmur-worker"
main = "src/index.ts"
compatibility_date = "2026-05-16"
workers_dev = true

[[durable_objects.bindings]]
name = "RATE_LIMITER"
class_name = "RateLimitDurableObject"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["RateLimitDurableObject"]

[vars]
APPLE_APP_ATTEST_APP_ID = "TEAMID.com.q9labsai.murmur"
APPLE_APP_ATTEST_ENVIRONMENT = "production"
MURMUR_ENV = "development"
OPENAI_REALTIME_MODEL = "gpt-realtime-translate"
GOOGLE_PLAY_INTEGRITY_REQUIRED_DEVICE_VERDICT = "MEETS_DEVICE_INTEGRITY"
GOOGLE_PLAY_PACKAGE_NAME = "com.q9labsai.murmur"

[env.development]
name = "murmur-worker-development"
workers_dev = true

[[env.development.durable_objects.bindings]]
name = "RATE_LIMITER"
class_name = "RateLimitDurableObject"

[[env.development.migrations]]
tag = "v1"
new_sqlite_classes = ["RateLimitDurableObject"]

[env.development.vars]
APPLE_APP_ATTEST_APP_ID = "TEAMID.com.q9labsai.murmur"
APPLE_APP_ATTEST_ENVIRONMENT = "development"
MURMUR_ENV = "development"
OPENAI_REALTIME_MODEL = "gpt-realtime-translate"
GOOGLE_PLAY_INTEGRITY_REQUIRED_DEVICE_VERDICT = "MEETS_DEVICE_INTEGRITY"
GOOGLE_PLAY_PACKAGE_NAME = "com.q9labsai.murmur"

[env.production]
name = "murmur-worker-production"
workers_dev = true
routes = [
  { pattern = "murmur.q9labs.ai", custom_domain = true },
]

[[env.production.durable_objects.bindings]]
name = "RATE_LIMITER"
class_name = "RateLimitDurableObject"

[[env.production.migrations]]
tag = "v1"
new_sqlite_classes = ["RateLimitDurableObject"]

[env.production.vars]
APPLE_APP_ATTEST_APP_ID = "TEAMID.com.q9labsai.murmur"
APPLE_APP_ATTEST_ENVIRONMENT = "production"
MURMUR_ENV = "production"
OPENAI_REALTIME_MODEL = "gpt-realtime-translate"
GOOGLE_PLAY_INTEGRITY_REQUIRED_DEVICE_VERDICT = "MEETS_DEVICE_INTEGRITY"
GOOGLE_PLAY_PACKAGE_NAME = "com.q9labsai.murmur"
