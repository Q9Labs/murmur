plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.murmuraudio'
version = '1.2.0'

android {
  namespace "expo.modules.murmuraudio"
  defaultConfig {
    versionCode 1
    versionName "1.2.0"
  }
}

dependencies {
  implementation "com.google.android.play:integrity:1.6.0"
}
