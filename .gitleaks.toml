title = "Murmur Gitleaks"

[extend]
useDefault = true

[[allowlists]]
description = "The auth failure test uses this exact public, local-only fixture secret."
condition = "AND"
regexTarget = "line"
targetRules = ["generic-api-key"]
paths = ['''^apps/worker/src/observability/outcomes\.test\.ts$''']
regexes = ['''BETTER_AUTH_SECRET: "fixture-secret-with-at-least-32-characters"''']

[[allowlists]]
description = "Repo paths that intentionally contain store copy, generated metadata, or local scratch evidence."
paths = [
  '''^docs/legal/''',
  '''^apps/mobile/fastlane/metadata/''',
  '''^scratchpad/''',
  '''^apps/mobile/store-assets/source/'''
]

[[allowlists]]
description = "The release manifest stores an opaque 1Password item reference, not a credential."
condition = "AND"
regexTarget = "line"
targetRules = ["generic-api-key"]
paths = ['''^release/manifest\.json$''']
regexes = ['''"p12_password_item_id"\s*:\s*"[a-z0-9]{26}"''']

[[allowlists]]
description = "The release manifest records the public SHA-256 checksum of the Android upload keystore."
condition = "AND"
regexTarget = "line"
targetRules = ["generic-api-key"]
paths = ['''^release/manifest\.json$''']
regexes = ['''"keystore_sha256"\s*:\s*"[a-f0-9]{64}"''']

[[allowlists]]
description = "The PostHog project token is a public client-side ingestion key shipped in every app build."
condition = "AND"
regexTarget = "line"
targetRules = ["generic-api-key"]
paths = ['''^apps/mobile/eas\.json$''']
regexes = ['''"EXPO_PUBLIC_POSTHOG_PROJECT_TOKEN"\s*:\s*"phc_[A-Za-z0-9]{43}"''']

[[allowlists]]
description = "These exact public local-storage names are not API credentials."
condition = "AND"
regexTarget = "line"
targetRules = ["generic-api-key"]
paths = ['''^apps/mobile/src/lib/(installIdentity|insightsConsent)\.ts$''']
regexes = ['''^\s*const [A-Za-z]+ = "murmur_(privacy_acknowledged_v1|third_party_ai_consent_v[234]|insights_consent_v[12])";$''']

[[allowlists]]
description = "The Apple example contains this exact non-key placeholder."
condition = "AND"
regexTarget = "line"
targetRules = ["private-key"]
paths = ['''^apps/worker/\.dev\.vars\.example$''']
regexes = ['''(?m)^APPLE_PRIVATE_KEY="-----[B]EGIN PRIVATE KEY-----\\nreplace-with-apple-sign-in-key\\n-----END PRIVATE KEY-----\\n"$''']

[[allowlists]]
description = "The secret validator searches for this literal PEM header."
condition = "AND"
regexTarget = "line"
targetRules = ["private-key"]
paths = ['''^tooling/scripts/validate-no-secrets\.mjs$''']
regexes = ['''(?m)^\s*contents\.includes\('\.replace\("-----[B]EGIN PRIVATE KEY-----"'\),$''']
