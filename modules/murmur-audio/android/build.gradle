plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.murmuraudio'
version = '0.7.10'

android {
  namespace "expo.modules.murmuraudio"
  defaultConfig {
    versionCode 1
    versionName "0.7.10"
  }
  lintOptions {
    abortOnError false
  }
}

dependencies {
  implementation "com.google.android.play:integrity:1.6.0"
}
